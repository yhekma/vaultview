{{define "content"}}
{{if .Frontmatter}}
<details class="properties-panel mb-6">
    <summary class="properties-summary px-4 py-2 text-sm font-medium cursor-pointer">Properties</summary>
    <div class="px-4 pb-3">
        <table class="text-sm w-full">
            {{range $key, $val := .Frontmatter}}
            <tr class="properties-row border-b last:border-0">
                <td class="properties-key py-1.5 pr-4 align-top">{{$key}}</td>
                <td class="properties-val py-1.5">{{$val}}</td>
            </tr>
            {{end}}
        </table>
    </div>
</details>
{{end}}

<article class="prose max-w-none">
    {{.Content}}
</article>
{{end}}
