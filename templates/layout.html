<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — VaultView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: 'none',
                            },
                        },
                    },
                },
            },
            plugins: [],
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        // Apply theme before page renders to avoid flash
        (function() {
            var theme = localStorage.getItem('vaultview-theme') || 'light';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: localStorage.getItem('vaultview-theme') === 'dark' ? 'dark' : 'neutral'
        });
    </script>
</head>
<body class="h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-72 border-r flex flex-col h-full shrink-0">
        <div class="sidebar-header p-4 border-b flex items-center justify-between">
            <a href="/" class="sidebar-title text-lg font-semibold no-underline">{{.VaultName}}</a>
            <button onclick="toggleTheme()" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                <span id="theme-icon">&#9790;</span>
            </button>
        </div>
        <div class="sidebar-filter p-3 border-b">
            <input type="text" id="tree-filter" placeholder="Filter notes..."
                   class="w-full px-3 py-1.5 text-sm border rounded-md">
        </div>
        <nav id="file-tree" class="flex-1 overflow-y-auto p-2 text-sm">
            <div class="p-2" style="color: var(--text-faint)">Loading...</div>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="content-area flex-1 overflow-y-auto">
        <div class="max-w-4xl mx-auto px-8 py-8">
            {{template "content" .}}
        </div>
    </main>

    <script>
    // Theme toggle
    function toggleTheme() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        localStorage.setItem('vaultview-theme', isDark ? 'light' : 'dark');
        // Reload so mermaid re-initializes with the correct theme
        location.reload();
    }
    // Set icon on load
    (function() {
        var theme = localStorage.getItem('vaultview-theme') || 'light';
        var icon = document.getElementById('theme-icon');
        if (icon) icon.innerHTML = theme === 'dark' ? '&#9788;' : '&#9790;';
    })();

    // File tree rendering
    async function loadTree() {
        const resp = await fetch('/api/tree');
        const tree = await resp.json();
        const container = document.getElementById('file-tree');
        container.innerHTML = '';
        renderNodes(tree, container, 0);
        setupFilter();
    }

    function renderNodes(nodes, parent, depth) {
        for (const node of nodes) {
            if (node.isDir) {
                const folder = document.createElement('div');
                folder.className = 'tree-folder';
                folder.dataset.path = node.path;

                const toggle = document.createElement('div');
                toggle.className = 'tree-toggle flex items-center gap-1 px-2 py-1 rounded cursor-pointer';
                toggle.style.paddingLeft = (depth * 12 + 8) + 'px';
                const arrow = document.createElement('span');
                arrow.className = 'tree-arrow text-xs transition-transform';
                arrow.innerHTML = '&#9654;';
                const icon = document.createElement('span');
                icon.innerHTML = '&#128193;';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'truncate';
                nameSpan.textContent = node.name;
                toggle.appendChild(arrow);
                toggle.appendChild(icon);
                toggle.appendChild(nameSpan);

                const children = document.createElement('div');
                children.className = 'hidden';

                toggle.addEventListener('click', () => {
                    children.classList.toggle('hidden');
                    toggle.querySelector('.tree-arrow').classList.toggle('rotate-90');
                });

                folder.appendChild(toggle);
                folder.appendChild(children);
                parent.appendChild(folder);
                renderNodes(node.children, children, depth + 1);
            } else {
                if (!node.name.endsWith('.md') && !node.name.endsWith('.canvas')) continue;
                const link = document.createElement('a');
                // Strip .md from URL (Obsidian convention) but keep .canvas
                const viewPath = node.name.endsWith('.canvas')
                    ? node.path
                    : node.path.replace(/\.md$/, '');
                link.href = '/view/' + encodeURIComponent(viewPath).replace(/%2F/g, '/');
                link.className = 'tree-file flex items-center gap-1 px-2 py-1 rounded no-underline block';
                link.style.paddingLeft = (depth * 12 + 8) + 'px';
                link.dataset.name = node.name.toLowerCase();
                const fileNameSpan = document.createElement('span');
                fileNameSpan.className = 'truncate';
                fileNameSpan.textContent = node.name;
                link.appendChild(fileNameSpan);
                parent.appendChild(link);
            }
        }
    }

    function setupFilter() {
        const input = document.getElementById('tree-filter');
        input.addEventListener('input', () => {
            const q = input.value.toLowerCase();
            document.querySelectorAll('.tree-file').forEach(el => {
                const match = el.dataset.name.includes(q);
                el.style.display = match ? '' : 'none';
            });
            // Show all folders when filtering, hide empty ones
            document.querySelectorAll('.tree-folder').forEach(folder => {
                const children = folder.querySelector('div:last-child');
                if (q) {
                    children.classList.remove('hidden');
                    folder.querySelector('.tree-arrow').classList.add('rotate-90');
                    const hasVisible = children.querySelector('.tree-file:not([style*="display: none"])');
                    const hasVisibleFolder = children.querySelector('.tree-folder:not([style*="display: none"])');
                    folder.style.display = (hasVisible || hasVisibleFolder) ? '' : 'none';
                } else {
                    folder.style.display = '';
                }
            });
        });
    }

    // Highlight active note
    const currentPath = window.location.pathname;
    document.addEventListener('DOMContentLoaded', () => {
        loadTree().then(() => {
            document.querySelectorAll('.tree-file').forEach(el => {
                if (el.getAttribute('href') === currentPath) {
                    el.classList.add('tree-file-active');
                    // Expand parent folders
                    let parent = el.parentElement;
                    while (parent) {
                        if (parent.classList && parent.classList.contains('hidden')) {
                            parent.classList.remove('hidden');
                            const arrow = parent.previousElementSibling?.querySelector('.tree-arrow');
                            if (arrow) arrow.classList.add('rotate-90');
                        }
                        parent = parent.parentElement;
                    }
                }
            });
        });
    });
    </script>
</body>
</html>
